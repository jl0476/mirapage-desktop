[package]
name = "mirapage-desktop"
version = "0.1.0"
description = "Cross-platform desktop comic reader"
authors = ["MiraPage Team"]
edition = "2021"
rust-version = "1.75"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mirapage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# indexmap 1.x：强制启用 std feature 并注入 build-deps 链。indexmap 1.9.3 的 build.rs 在未启
# 用 std feature 时用 autocfg 探测 sysroot 的 std crate，该探测在 rustc 1.96 下失效，导致
# has_std 不 emit，编译走 `IndexMap<K, V, S>`（S 无默认值）分支，使 tauri-build 间接依赖的
# schemars 0.8.x 的 `IndexMap<K, V>` 双参数写法（依赖 S=RandomState 默认值）报 E0107。
# indexmap 1.x 终止于 1.9.3、tauri-build 锁 schemars 0.8.x 均无升级路径。必须放在
# [build-dependencies]：resolver v2 (edition 2021) 将 build-deps 与 normal-deps 的 feature
# 分离解析，放在 [dependencies] 无法传到 tauri-build -> schemars -> indexmap 这条 build-deps 链。
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", package = "tauri-plugin-fs" }
tauri-plugin-dialog = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", package = "tauri-plugin-dialog" }
# 窗口状态持久化：退出保存大小/位置/最大化，下次启动恢复（用户需求 2026-08-18）
tauri-plugin-window-state = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", package = "tauri-plugin-window-state" }
# tauri-plugin-log (Phase X 启用: production 文件日志 + devtools)
# 注: v0.1.0-module1.7 启用后 exe 启动崩溃 (plugin init 失败),
# 回退到只用 console.log + Rust tracing. 后续单独排查日志方案.
# tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", package = "tauri-plugin-log" }
# tauri-plugin-store（Phase 1 注释：settings 走自家 DB，不需要此 plugin）
# tauri-plugin-store = "2"
# tauri-plugin-updater（Phase 9 启用：自动更新）
# tauri-plugin-updater = "2"

async-trait = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }

# 远程源（Phase 7-8 启用）
# smb-rs 重命名为 smb（afiffon/smb-rs 项目）, 0.11 是当前可用版本
smb = "0.11"
# futures-util 是 smb 默认 feature `async` 启用的间接依赖；本项目显式声明以便
# `use futures_util::StreamExt;` 在 smb::Directory::query 消费 stream 时走稳定路径
# （不用 futures_util 直接访问 smb 私有依赖图）
futures-util = "0.3"
# time 0.3 显式声明：smb ResourceHandle::modified() 返回 time::PrimitiveDateTime，
# 转 Unix 秒需 `assume_utc().unix_timestamp()`（smb 内部用 0.3.45，本项目 type 同 major.minor 互通）
time = { version = "0.3", features = ["macros"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
quick-xml = "0.36"   # WebDAV PROPFIND 响应 XML 解析

# Archive readers；版本必须保持 Rust 1.75 可编译。
zip = { version = "=2.4.2", features = ["aes-crypto"] }
unrar_sys = "=0.5.8" # 直接使用 UnRAR 低层 API + data callback；不引入高层 unrar crate（密码时序与 NEEDPASSWORD 缺陷，见任务 5 步骤 4）
# sevenz-rust 0.6.1 的 aes256sha256.rs:7 存在未加 cfg 门禁的 `use lzma_rust::CountingWriter;`
# （其唯一使用点 mod enc 有 #[cfg(feature = "compress")] 门，import 本身没有），而
# CountingWriter 只在 lzma-rust 的 encoder feature 下存在——因此 0.6.1 在任何未启用
# `lzma-rust/encoder` 的特性组合下都无法编译。按任务简报的回退条款：生产依赖显式启用
# `compress`（= lzma-rust/encoder）。代价：LZMA 编码器会进入发布二进制，这与"生产只留
# 解码"的初衷冲突，属上游缺陷强制妥协（升级 sevenz-rust 修复门禁后可回收）。
sevenz-rust = { version = "=0.6.1", default-features = false, features = ["aes256", "compress"] }
# 任务 6 header 预检（sevenz_header_precheck.rs）的直接依赖：aes/cbc 在 sevenz-rust 中
# 只是可选依赖，本项目不能隐式依赖传递解析，必须显式声明；lzma-rust 与其传递版本同版锁定，
# 且必须 default-features = false——lzma-rust 0.1.7 的默认 feature 就是 encoder，
# 直接裸引会在生产构建重新启用编码器，与"生产只留解码"冲突。
lzma-rust = { version = "=0.1.7", default-features = false }
aes = { version = "0.8", features = ["zeroize"] } # zeroize feature：清除 AES key schedule（§5.2 密码生命周期约束）
cbc = "0.1"
# zeroize 锁 1.8.1 + 锁文件钉 zeroize_derive 1.4.2：zeroize 1.9 把 `derive` 变为默认
# feature，且 zip 2.4.2 的 aes-crypto 又显式启用 zeroize/zeroize_derive——两者都会拉入
# zeroize_derive 1.5.0（edition2024，cargo 1.75 无法解析其 manifest），违反「新增依赖
# 不得新增 1.75 失败」约束。1.8.1 默认不含 derive；1.4.2 满足 zeroize ^1.3 / zip 传递
# 需求且为 edition 2021。勿运行裸 `cargo update`（会把 derive 顶回 1.5.0）。
zeroize = "=1.8.1"

# 数据库（运行时依赖，原误置 [dev-dependencies]：db/* 与 commands/* 模块 use rusqlite）
rusqlite = { version = "0.32", features = ["bundled"] }

# 凭据（module3.2.0-media-display 启用：账户密码走 OS 凭据管理器，不落 DB）
keyring = "3"

# 错误处理
thiserror = "1"
anyhow = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# URL 处理
url = "2"
percent-encoding = "2"

# 图像处理（v0.1.0-module3.0.7 缩略图缓存：EXIF 方向归一化 + 缩放 + WebP 编码）
# image 0.24 系列对 MSRV 1.75 友好；禁用默认特性按需启用解码器，避免拉入不需要的依赖。
# 仅启用瀑布流需要的 5 种格式解码；JPEG/PNG/GIF/BMP/WebP。
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
# EXIF Orientation 解析（只读 Orientation tag，不复制其它元数据）。
kamadak-exif = "0.6.1"
# WebP 编码器（image crate 的 webp feature 只做解码，编码用独立 webp crate）。
webp = { version = "0.2.6", default-features = false }
# 缓存 key 稳定哈希（SHA-256；缩略图 cache_key/source_key 需跨运行/版本稳定且低碰撞）。
sha2 = "0.10"

# 阅读器屏幕常亮 (v0.1.0-module2.0). Windows 用 SetThreadExecutionState;
# macOS/Linux 暂 stub (IOPMAssertion / org.freedesktop.ScreenSaver 等需要
# 平台专有 crate, Phase 9 跨平台分发时再补).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Power"] }

[dev-dependencies]
# Phase 3 实装测试使用 tempfile 生成临时 CBZ/ZIP 文件
tempfile = "3"
# 仅 benchmark：对比 image crate resize vs fast-image-resize（SIMD）加速比
fast_image_resize = "5"
# 任务 6 测试用 SevenZWriter 运行时生成 fixture；`compress` 只在测试构建启用。
sevenz-rust = { version = "=0.6.1", default-features = false, features = ["aes256", "compress"] }

[features]
# 此特性用于在生产环境构建时启用自定义协议
custom-protocol = ["tauri/custom-protocol"]


# ─── 算法独立测试 ──────────────────────────────────────────────────────
# 注意：algorithm/* 模块的纯 std 测试放在同级目录 `src-tauri-algorithm-tests/`，
# 独立 Cargo 工程：可秒级验证算法而无需拉起 Tauri 全栈依赖图。schemars/indexmap
# 兼容性现已修复（见上方 [build-dependencies] 的 indexmap 与 BUILD.md §2），全栈 cargo
# test 可用；此独立工程仍保留用于快速算法迭代。
# 运行：
#   cargo test --manifest-path src-tauri-algorithm-tests/Cargo.toml
