name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend (Vite)
        # tauri::generate_context!() 在 cargo build 时把 dist/ 嵌入二进制
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Build self-contained exe
        # 直接 cargo build --release,不跑 tauri build(避免 MSI/NSIS 打包)
        # tauri::generate_context!() 编译时嵌入前端 dist/,所以裸 exe 自包含
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Locate built exe
        id: locate
        # Windows 上 Tauri 默认 binary 名 = productName (PascalCase),即 MiraPage.exe
        # 但 cargo crate name = mirapage-desktop,所以可能两种都出现;列出来兜底
        run: |
          $exe = Get-ChildItem src-tauri/target/release/*.exe |
                Where-Object { $_.Name -notmatch '\.(pdb|exp)$' } |
                Select-Object -First 1
          if (-not $exe) { Write-Error "no exe found"; exit 1 }
          "exe_name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "exe_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload exe as Release asset (tag trigger)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.exe_path }}
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Upload exe as artifact (manual trigger only)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mirapage-windows-portable
          path: ${{ steps.locate.outputs.exe_path }}
          if-no-files-found: error