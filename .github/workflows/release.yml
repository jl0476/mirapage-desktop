name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Build self-contained exe (via Tauri CLI)
        # 用 tauri build --no-bundle 而不是 cargo build --release —— 关键差异：
        # Tauri CLI 会跑完整流程（beforeBuildCommand + cargo build + 协议注册到 WebView2），
        # 而 cargo build 单独跑漏掉 Tauri 协议注册，导致 webview 加载
        # http://tauri.localhost/ 时 fallback 到真实 HTTP 失败（白屏 + Edge 错误页）。
        # --no-bundle 跳过 MSI/NSIS 打包，只产裸 exe；前端由 generate_context!() 嵌入。
        run: npm run tauri -- build --no-bundle

      - name: Locate built exe
        id: locate
        # Windows 上 Tauri 默认 binary 名 = productName (PascalCase),即 MiraPage.exe
        # 但 cargo crate name = mirapage-desktop,所以可能两种都出现;列出来兜底
        run: |
          $exe = Get-ChildItem src-tauri/target/release/*.exe |
                Where-Object { $_.Name -notmatch '\.(pdb|exp)$' } |
                Select-Object -First 1
          if (-not $exe) { Write-Error "no exe found"; exit 1 }
          "exe_name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "exe_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload exe as Release asset (tag trigger)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.exe_path }}
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Upload exe as artifact (manual trigger only)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mirapage-windows-portable
          path: ${{ steps.locate.outputs.exe_path }}
          if-no-files-found: error